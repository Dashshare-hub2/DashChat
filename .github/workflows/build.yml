name: Build Cross-Platform Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            platform: win
          - name: macOS
            os: macos-latest
            platform: mac
          - name: Android (32-bit)
            os: ubuntu-latest
            platform: android32
          - name: Android (64-bit)
            os: ubuntu-latest
            platform: android64
          - name: iOS
            os: macos-latest
            platform: ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          platform: ${{ matrix.config.platform }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashchat-${{ matrix.config.platform }}
          path: build/*.geode