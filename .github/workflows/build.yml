name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-2022
            extra-flags: ""

          - name: Android32
            os: ubuntu-22.04
            target: Android32
            extra-flags: ""

          - name: Android64
            os: ubuntu-22.04
            target: Android64
            extra-flags: ""

          - name: macOS
            os: macos-13
            extra-flags: ""

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup C/C++ Compiler & Build Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.geode
            build
          key: ${{ runner.os }}-${{ matrix.config.target || 'desktop' }}-${{ hashFiles('CMakeLists.txt', 'mod.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.config.target || 'desktop' }}-

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v3.8.0
          target: ${{ matrix.config.target }}
          combine: true
          export-binaries: true

  package:
    name: Package Mod (.geode)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Package Multi-platform Mod
        uses: geode-sdk/build-geode-mod/combine@main
        with:
          output: "DashChat.geode"

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashChat-Geode-Mod
          path: DashChat.geode